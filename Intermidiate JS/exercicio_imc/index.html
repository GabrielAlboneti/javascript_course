<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Modelo</title>
      <link rel="stylesheet" href="./assets/css/style.css" />
   </head>
   <body>
      <section class="container">
         <h2>Tabela IMC</h2>
         <div class="table">
            <div>
               <h3>IMC</h3>
               <p>
                  Menos do que 18.5 <br />
                  Entre 18,5 e 24,9 <br />
                  Entre 25 e 29,9 <br />
                  Entre 30 e 34,9 <br />
                  Entre 35 e 39,9 <br />
                  Mais do que 40
               </p>
            </div>
            <div>
               <h3>Resultado</h3>
               <p>
                  Abaixo do peso <br />
                  Peso normal <br />
                  Sobrepeso <br />
                  Obesidade grau 1 <br />
                  Obesidade grau 2 <br />
                  Obesidade grau 3
               </p>
            </div>
         </div>

         <h2>Calcule seu IMC</h2>
         <form class="form" action="">
            <label for="weight">Peso:</label>
            <input type="number" id="weight" step="1" min="5" />

            <label for="height">Altura:</label>
            <input type="number" id="height" step="0.01" min="0.50" />

            <button type="submit">Enviar</button>
         </form>
         <div class="message"></div>
      </section>

      <!-- <script src="./assets/js/main.js"></script> -->
      <script src="./assets/js/solucao_professor.js"></script>
   </body>
</html>
