<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Exercícios com Strings</title>
   </head>
   <body>
      <script>
         const nomeUsuario = prompt("Digite o seu nome completo:");
         // const segundaLetra = nomeUsuario.charAt(1); // Melhor usar colchetes
         const primeiraLetraA = nomeUsuario.indexOf("e");
         const ultimaLetraA = nomeUsuario.lastIndexOf("e");
         const ultimasLetras = nomeUsuario.slice(-3);
         const vetorNome = nomeUsuario.split(" ");

         document.body.innerHTML = `O seu nome é: <strong>${nomeUsuario}</strong> <br/>`;
         document.body.innerHTML += `O seu nome tem <strong>${nomeUsuario.length}</strong> letras <br/>`;
         document.body.innerHTML += `A segunda letra do seu nome é: <strong>${nomeUsuario[2]}</strong> <br/>`;
         document.body.innerHTML += `Qual o primeiro índice da letra e no seu nome? <strong>${primeiraLetraA}</strong> <br/>`;
         document.body.innerHTML += `Qual o último índice da letra e no seu nome? <strong>${ultimaLetraA}</strong> <br/>`;
         document.body.innerHTML += `As últimas 3 letras do seu nome são: <strong>${ultimasLetras}</strong> <br/>`;
         document.body.innerHTML += `As palavras do seu nome são: <strong>${vetorNome}</strong> <br/>`;
         document.body.innerHTML += `Seu nome com letras maiúsculas: <strong>${nomeUsuario.toUpperCase()}</strong> <br/>`;
         document.body.innerHTML += `Seu nome com letras minúsculas: <strong>${nomeUsuario.toLowerCase()}</strong> <br/>`;
      </script>
   </body>
</html>
