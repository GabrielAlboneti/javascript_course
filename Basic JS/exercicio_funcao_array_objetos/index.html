<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Exercício Funções Arrays Objetos</title>
   </head>
   <body>
      <form class="form" action="" method="get">
         <p>
            <label for="nome">Nome: </label>
            <input type="text" id="nome" /><br />
         </p>
         <p>
            <label for="sobrenome">Sobrenome: </label>
            <input type="text" id="sobrenome" /><br />
         </p>
         <p>
            <label for="peso">Peso: </label>
            <input type="number" id="peso" /><br />
         </p>
         <p>
            <label for="altura">Altura: </label>
            <input type="number" id="altura" step="0.01" /><br />
         </p>

         <button type="submit">Enviar</button>
      </form>

      <div class="resultado"></div>
   </body>
   <script src="./js/scripts.js"></script>
</html>

<!-- 
step: define quais números são aceitos no form; 
Ex.: step="0.01" aceita 2 casas decimais, enquanto step="2" só aceita números pares;
 -->
